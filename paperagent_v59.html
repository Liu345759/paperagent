function clearExecChat(){
  const box = document.getElementById('execChatStream');
  if(box) box.querySelectorAll('.chat-msg').forEach(n=>n.remove());
  const input = document.getElementById('execChatInput');
  if(input){ input.value=''; autoGrowTextarea(input); }
  toast('对话已清空');
}
function restoreBreakpoint(snap){
  document.querySelectorAll('.decision-card').forEach(card=>card.remove());
  breakActive = !!(snap && snap.breakActive);
  if(breakActive && currentModule && modules[currentModule]){
    addDecisionCard(modules[currentModule].name, currentModule);
    const m = modules[currentModule];
    const bt=document.getElementById('breakTitle');
    const bx=document.getElementById('breakText');
    if(bt) bt.textContent=m.name+'结果待确认';
    if(bx) bx.textContent='已退回历史断点，可确认、重跑或在对话中调整。';
    document.getElementById('executeState').textContent='当前断点：'+m.name;
  }else{
    document.getElementById('executeState').textContent='已退回历史论文';
  }
}

async function restoreHistory(id){
  if(!id) return;
  try{
    const res = await fetch(API_BASE + '/api/history?id=' + encodeURIComponent(id));
    const data = await res.json();
    if(!res.ok || data.ok === false) throw new Error(data.error || '退回失败');
    const item = data.item || {};
    const snap = item.snapshot && typeof item.snapshot==='object' ? item.snapshot : {};
    if(item.question) researchBrief.question = item.question;
    if(item.note != null) researchBrief.dataDesc = item.note;
    applyLiveRun({
      history_id: item.id,
      question: item.question,
      note: item.note,
      papers: item.papers || [],
      references: item.references || [],
      paper: item.paper || '',
      sections: item.sections || {},
      parts: item.parts || null,
      llm_meta: item.llm_meta || null,
      year_range: item.year_range,
      closure: item.closure,
      count: item.count || (item.papers||[]).length
    });
    acceptedPapers = (item.papers || []).slice();
    paperExpandLevel = snap.paperExpandLevel || 1;
    Object.keys(moduleRerunCount).forEach(k=>delete moduleRerunCount[k]);
    Object.assign(moduleRerunCount, snap.moduleRerunCount || {});
    if(snap.previews){
      Object.keys(snap.previews).forEach(mid=>{
        if(modules[mid]) modules[mid].preview = snap.previews[mid];
      });
    }
    buildRunList();
    Object.keys(moduleRunState).forEach(mid=>moduleRunState[mid]='idle');
    if(snap.moduleRunState){
      Object.assign(moduleRunState, snap.moduleRunState);
    }else{
      runModules.forEach(mid=>{ moduleRunState[mid] = item.paper ? 'done' : 'idle'; });
    }
    currentModule = (snap.currentModule && modules[snap.currentModule]) ? snap.currentModule : (runModules[runModules.length-1] || currentModule);
    runIndex = (typeof snap.runIndex==='number') ? snap.runIndex : runModules.findIndex(mid=>moduleRunState[mid]!=='done');
    if(runIndex<0) runIndex = runModules.length;
    stepBusy = false;
    cacheAllModulePreviews();
    const initial=document.getElementById('initialRunCard');
    if(initial){
      if(snap.initialResolved !== false) initial.classList.add('resolved');
      else initial.classList.remove('resolved');
    }
    restoreChatMessages(snap.chat || []);
    restoreBreakpoint(snap);
    renderFlowTree();
    renderWorkbench();
    const allDone = runModules.length && runModules.every(mid=>moduleRunState[mid]==='done');
    if(item.paper && allDone && !breakActive){
      showFinalResult();
    }else if(currentModule && moduleResultCache[currentModule]){
      document.getElementById('documentPreview').innerHTML = moduleResultCache[currentModule];
      renderVerifier(currentModule);
    }else if(item.paper){
      showFinalResult();
    }
    closeHistoryPanel();
    addChat('agent','已退回到这篇历史论文。六个步骤和断点也一并恢复。');
    toast('已退回历史论文');
  }catch(err){
    toast(err.message || '退回失败');
  }
}

function livePayload(extraNote, opts){
  opts = opts || {};
  const base = researchBrief.dataDesc.trim();
  const extra = extraNote != null ? String(extraNote).trim() : '';
  const note = [base, extra].filter(Boolean).join('；');
  const payload = {
    question: researchBrief.question.trim(),
    note: note,
    files: (researchBrief.fileBodies || []).map(f=>({name:f.name, text:f.text||'', encoding:f.encoding||'', data:f.data||''})),
    module: opts.module || '',
    rerun: opts.rerun || 0,
    start: opts.start || 0,
    sort: opts.sort || 'relevance',
    exclude: opts.exclude || []
  };
  if(opts.keepPapers && opts.keepPapers.length){
    payload.keep_papers = opts.keepPapers.map(p=>({
      title:p.title, authors:p.authors||[], year:p.year, doi:p.doi,
      journal:p.journal, url:p.url, source:p.source, arxiv_id:p.arxiv_id,
      abstract:p.abstract||'', published:p.published||'',
      fulltext:p.fulltext||'', digest:p.digest||null, parse_kind:p.parse_kind||'',
      score:p.score||0
    }));
  }
  if(opts.instruction) payload.instruction = opts.instruction;
  payload.expand = (opts.expand != null) ? opts.expand : paperExpandLevel;
  if(writerConfig.mode === 'api'){
    payload.writer = {
      mode: 'api',
      provider: writerConfig.provider,
      model: writerConfig.model,
      base_url: writerConfig.baseUrl,
      api_key: writerConfig.apiKey
    };
    const mid = opts.module || '';
    if(mid && liveRun){
      if(liveRun.parts) payload.keep_parts = liveRun.parts;
      if(liveRun.llm_meta) payload.keep_meta = liveRun.llm_meta;
    }
  }
  payload.variants = {};
  (typeof coreModules!=='undefined'?coreModules:[]).forEach(id=>{ payload.variants[id]=moduleRerunCount[id]||0; });
  return payload;
}

let liveRunPromise = null;
async function ensureLiveRun(force, moduleId){
  if(liveRun && liveRun.sections && !force) return liveRun;
  if(liveRunPromise && !force) return liveRunPromise;
  const q = researchBrief.question.trim();
  if(!q) throw new Error('请先填写研究问题');
  const rerunN = force ? (moduleRerunCount[moduleId] || 0) : 0;
  const chatEl = document.getElementById('execChatInput');
  const chatExtra = chatEl ? chatEl.value.trim() : '';
  const sorts = ['relevance','lastUpdatedDate','submittedDate'];
  const exclude = [];
  const currentPapers = acceptedPapers || (liveRun && liveRun.papers) || [];
  const keep = (moduleId && currentPapers.length) ? currentPapers : null;
  const lengthAsk = isLengthAsk(chatExtra);
  bumpPaperExpand(chatExtra);
  const payload = livePayload(lengthAsk ? null : (chatExtra || null), {
    module: moduleId || '',
    rerun: rerunN,
    start: 0,
    sort: 'relevance',
    exclude: exclude,
    keepPapers: keep,
    instruction: chatExtra || '',
    expand: paperExpandLevel
  });
  liveRunPromise = callPaperagentApi('/api/run', payload).then(data=>{
    applyLiveRun(data);
    if(chatExtra && !lengthAsk){
      researchBrief.dataDesc = [researchBrief.dataDesc.trim(), chatExtra].filter(Boolean).join('；');
    }
    if(chatExtra && chatEl) chatEl.value='';
    return data;
  }).finally(()=>{ liveRunPromise = null; });
  return liveRunPromise;
}

function cacheAllModulePreviews(){
  buildRunList();
  runModules.forEach(id=>{
    const m=modules[id];
    if(!m) return;
  const policy=getPolicy(id);
    moduleResultCache[id]=`<div class="preview-source"><b>${m.name}</b><span>${policy.stage} · ${policy.permission}</span><span class="lock-tag">${policy.scopes[0]}</span></div>`+(m.preview||'');
  });
}

function finishAllModules(){
  buildRunList();
  cacheAllModulePreviews();
  runModules.forEach(id=>{
    moduleRunState[id]='done';
    emitPipelineForModule(id);
  });
  runIndex=runModules.length;
  currentModule=runModules[runModules.length-1];
  renderFlowTree();
  renderWorkbench();
  showFinalResult();
  persistRunSnapshot();
}

async function runAllToFinal(){
  if(mode!=='execute') showExecute();
  buildRunList();
  if(!runModules.length){toast('没有可运行的步骤');return}
  const q = researchBrief.question.trim();
  if(!q){toast('请先填写研究问题');return}
  breakActive=false;
  document.querySelectorAll('.decision-card:not(.resolved)').forEach(card=>card.classList.add('resolved'));
  const initial=document.getElementById('initialRunCard');
  if(initial) initial.classList.add('resolved');
  addChat('agent', writerConfig.mode==='api' ? '正在用所选模型写全部步骤…' : '正在检索文献并生成完整论文…');
  document.getElementById('executeState').textContent='正在生成完整论文';
  toast('正在检索，请稍候');
  try{
    if(writerConfig.mode==='api' && !writerReady()){
      throw new Error('请先填写 API Key 和模型');
    }
    const data = await ensureLiveRun(true);
    finishAllModules();
    addChat('agent', '论文已经写在右侧。');
    persistRunSnapshot();
    toast('论文已写在右侧');
  }catch(err){
    liveRun = null;
    addChat('agent', err.message || '生成失败');
    toast(err.message || '生成失败');
  }
}

function showFinalResult(){
  const paper = (liveRun && liveRun.paper) || '';
  document.getElementById('documentPreview').innerHTML =
    `<div class="preview-source"><b>完整论文</b><span>GB/T 7714 · 可编辑</span><span class="lock-tag">终稿</span></div>`
    + (paper || '<h1 class="paper-title">完整论文</h1><p class="indent">尚未生成。请先填写研究问题并点「一键出结果」。</p>');
  document.getElementById('executeState').textContent='完整论文已生成，可继续润色';
  document.getElementById('currentNode').textContent='完整论文';
  verifierState.moduleId = liveRun ? 'paper' : null;
  const split = document.getElementById('previewSplit');
  if(split && !split.classList.contains('vf-collapsed')) renderVerifier(liveRun ? 'paper' : null);
}

function clearPipelineLog(silent){
  pipelineLog.length = 0;
  Object.keys(pipelineActive).forEach(k=>pipelineActive[k]=false);
  renderPipelineViz();
  updatePipelineTypeTree();
  if(!silent) toast('流程日志已清空');
}

function pushPipeline(kind, text){
  pipelineActive[kind] = true;
  pipelineLog.unshift({kind, text, t: new Date().toLocaleTimeString()});
  if(pipelineLog.length > 40) pipelineLog.pop();
  renderPipelineViz();
  updatePipelineTypeTree();
}

function renderPipelineViz(){
  const kinds = document.getElementById('pipelineKinds');
  if(kinds){
    kinds.querySelectorAll('.pipeline-kind').forEach(el=>{
      el.classList.toggle('active', !!pipelineActive[el.dataset.kind]);
    });
  }
  const log = document.getElementById('pipelineLog');
  if(!log) return;
  if(!pipelineLog.length){
    log.innerHTML = '<div class="plog"><span class="k">就绪</span><span>运行后会写入本次 arXiv 检索与统计结果。</span></div>';
    return;
  }
  const label = {split:'拆分', tool:'工具', rag:'RAG', result:'结果'};
  log.innerHTML = pipelineLog.slice(0,12).map(e=>`<div class="plog"><span class="k ${e.kind}">${label[e.kind]||e.kind}</span><span>${e.t} · ${escapeHtml(e.text)}</span></div>`).join('');
}

function updatePipelineTypeTree(){
  const map = {split:'pv-split', tool:'pv-tool', rag:'pv-rag', result:'pv-result'};
  Object.keys(map).forEach(k=>{
    const node = document.querySelector(`#pipelineTypeTree .node[data-id="${map[k]}"]`);
    if(!node) return;
    const st = node.querySelector('.state');
    if(st) st.textContent = pipelineActive[k] ? 'on' : '—';
    node.classList.toggle('active', !!pipelineActive[k]);
  });
}

function emitPipelineForModule(id){
  const name = modules[id] ? modules[id].name : id;
  pushPipeline('split', `总调度拆出子任务「${name}」`);
  const toolMap = {
    'module-lit-search':'查找公开文献库',
    'module-parse':'解析你上传的文件',
    'module-review':'根据文献整理综述',
    'module-data':'统计数字',
    'module-figure':'按研究问题画图并写入论文',
    'module-reference':'整理参考文献格式',
    'module-template':'调用模板匹配工具',
    'module-table':'调用三线表检查工具',
    'module-language':'调用低风险润色工具'
  };
  pushPipeline('tool', toolMap[id] || `调用「${name}」相关工具`);
  const ragMap = {
    'module-lit-search':'RAG → 公开学术文献临时库 · 语义向量匹配',
    'module-parse':'RAG → 文献临时库分块索引（页码锚点）',
    'module-review':'RAG → 召回文献片段供综述溯源',
    'module-data':'RAG → 通用统计与可视化规范库',
    'module-figure':'RAG → 统计与可视化规范库 · 图表模板',
    'module-reference':'RAG → GB/T 7714 格式规范库',
    'module-template':'RAG → 期刊模板与结构规范',
    'module-table':'RAG → 统计规范库 · 表格式规则',
    'module-language':'RAG → 学术表达规范（低风险）'
  };
  pushPipeline('rag', ragMap[id] || `RAG 召回「${name}」相关规范`);
  pushPipeline('result', `写入预览「${name}」并进入 HITL + Verifier`);
}

async function generateModule(id,isRerun=false){
  buildRunList();
  const index=runModules.indexOf(id);
  if(index<0) return;
  runIndex=index;
  const q = researchBrief.question.trim();
  if(!q){toast('请先填写研究问题');return}
  const othersDone = runModules.every(mid => mid===id || moduleRunState[mid]==='done');
  document.getElementById('executeState').textContent=isRerun?'正在重跑':'正在生成真实结果';
  toast(isRerun?'正在重跑本步':'正在检索，请稍候');
  try{
    await ensureLiveRun(isRerun, id);
  }catch(err){
    addChat('agent', err.message || '生成失败');
    toast(err.message || '生成失败');
    return;
  }
  cacheAllModulePreviews();
  const m=modules[id];
  const result=moduleResultCache[id];
  document.getElementById('documentPreview').innerHTML=result;
  currentModule=id;
  if(id==='module-lit-search' && liveRun && liveRun.papers){
    acceptedPapers = liveRun.papers.slice();
  }
  emitPipelineForModule(id);
  renderVerifier(id);
  const initial=document.getElementById('initialRunCard');
  if(initial) initial.classList.add('resolved');

  if(isRerun && othersDone){
    moduleRunState[id]='done';
    breakActive=false;
    renderFlowTree();
    renderWorkbench();
    document.getElementById('executeState').textContent='已重跑：'+shortModuleName(id);
    persistRunSnapshot();
    toast('已重跑');
    return;
  }

  breakActive=true;
  moduleRunState[id]='review';
  renderFlowTree();
  renderWorkbench();
  const bt=document.getElementById('breakTitle');
  const bx=document.getElementById('breakText');
  if(bt) bt.textContent=m.name+'结果待确认';
  if(bx) bx.textContent='结果已写入右侧预览，可确认、重跑或在对话中调整。';
  document.getElementById('executeState').textContent='当前断点：'+m.name;
  addChat('agent',`${isRerun?'已重新生成':'已完成'}「${m.name}」，共 ${liveRun.count||0} 篇文献。`);
  addDecisionCard(m.name,id);
  persistRunSnapshot();
  toast('已写入本次运行结果');
}
function rerunBreakpoint(id){
  if(!modules[id] || !modules[id].enabled){toast('该步骤未启用');return}
  if(mode!=='execute') showExecute();
  if(!researchBrief.question.trim()){toast('请先填写研究问题');return}
  if(!liveRun && !moduleResultCache[id]){toast('请先点「一键出结果」，再重跑某一步');return}
  if(stepBusy){toast('正在重跑，请稍候');return}
  breakActive=false;
  document.querySelectorAll('.decision-card:not(.resolved)').forEach(card=>card.classList.add('resolved'));
  currentModule=id;
  moduleRerunCount[id]=(moduleRerunCount[id]||0)+1;
  const chatEl=document.getElementById('execChatInput');
  const extra=chatEl?chatEl.value.trim():'';
  if(extra){
    addChat('user','补充说明：'+extra);
  }
  addChat('agent', `正在重跑「${shortModuleName(id)}」`);
  stepBusy=true;
  renderFlowTree();
  generateModule(id, true).finally(()=>{ stepBusy=false; renderFlowTree(); });
}
function rerunStep(){
  rerunBreakpoint(currentModule);
}
function confirmStep(){
  if(!breakActive)return;
  moduleRunState[currentModule]='done';
  breakActive=false;
  if(currentModule==='module-lit-search' && liveRun && liveRun.papers){
    acceptedPapers = liveRun.papers.slice();
  }
  buildRunList();
  const nextIndex=runModules.findIndex(id=>moduleRunState[id]!=='done');
  runIndex=nextIndex<0?runModules.length:nextIndex;
  renderFlowTree();
  renderWorkbench();
  const name = shortModuleName(currentModule);
  if(nextIndex<0){
    showFinalResult();
    document.getElementById('executeState').textContent='完整论文已生成';
    addChat('agent','论文已经写在右侧。');
    toast('已确认，并生成论文');
  }else{
    document.getElementById('executeState').textContent='已确认：'+name+'，可做下一步';
    addChat('agent', `已确认「${name}」。下一步会接着用这份结果。`);
    toast('已确认');
  }
  persistRunSnapshot();
}
function confirmAndRun(){
  confirmStep();
  if(runIndex<runModules.length)setTimeout(runNext,350);
}
function resetRun(){
  runIndex=0;breakActive=false;stepBusy=false;
  liveRun=null;
  liveRunPromise=null;
  acceptedPapers=null;
  paperExpandLevel=1;
  Object.keys(moduleRerunCount).forEach(k=>delete moduleRerunCount[k]);
  Object.keys(moduleRunState).forEach(id=>moduleRunState[id]='idle');
  Object.keys(moduleResultCache).forEach(id=>delete moduleResultCache[id]);
  currentModule=runModules[0] || currentModule;
  clearPipelineLog(true);
  renderFlowTree();
  renderWorkbench();
  document.getElementById('executeState').textContent='执行已重置';
  document.querySelectorAll('.decision-card').forEach(card=>card.remove());
  const initial=document.getElementById('initialRunCard');
  if(initial)initial.classList.remove('resolved');
  document.getElementById('documentPreview').innerHTML='<h1>结果预览</h1><p>运行后，结果会出现在这里。</p>';
  renderVerifier(null);
  toast('执行已重置');
}
function sendExecChat(){
  const i=document.getElementById('execChatInput'),text=i.value.trim();
  if(!text){toast('先输入调整指令');return}
  i.value='';autoGrowTextarea(i);addChat('user',text);
  const lengthAsk = isLengthAsk(text);
  if(!lengthAsk){
    researchBrief.dataDesc = [researchBrief.dataDesc.trim(), text].filter(Boolean).join('；');
  }
  bumpPaperExpand(text);
  addChat('agent','正在重写');
  const papers = (liveRun && liveRun.papers) || [];
  const payload = livePayload(lengthAsk ? null : text, {
    module: papers.length ? 'module-review' : '',
    keepPapers: papers,
    instruction: text,
    expand: paperExpandLevel
  });
  callPaperagentApi('/api/run', payload).then(data=>{
    applyLiveRun(data);
    finishAllModules();
    addChat('agent','已更新');
    toast('已更新');
  }).catch(err=>{
    addChat('agent', err.message || '生成失败');
    toast(err.message);
  });
}
function addChat(role,text){const b=document.getElementById('execChatStream'),d=document.createElement('div');d.className='chat-msg '+role;d.textContent=text;b.appendChild(d);b.scrollTop=b.scrollHeight}


function autoGrowTextarea(el){
  el.style.height='44px';
  const next=Math.min(el.scrollHeight,118);
  el.style.height=next+'px';
}
document.addEventListener('input', function(e){
  if(e.target && e.target.id==='execChatInput') autoGrowTextarea(e.target);
});

function handleExecUpload(input){
  const files = Array.from(input.files || []);
  if(!files.length) return;
  if(!Array.isArray(researchBrief.files)) researchBrief.files = [];
  if(!Array.isArray(researchBrief.fileBodies)) researchBrief.fileBodies = [];
  Promise.all(files.map(readUploadFile)).then(items=>{
    items.forEach(item=>{
      if(!researchBrief.files.includes(item.name)) researchBrief.files.push(item.name);
      const idx = researchBrief.fileBodies.findIndex(x=>x.name===item.name);
      if(idx>=0) researchBrief.fileBodies[idx]=item;
      else researchBrief.fileBodies.push(item);
    });
    addChat('user',`补充材料：${items.map(x=>x.name).join('、')}`);
    addChat('agent',`已加入共用材料（现共 ${researchBrief.files.length} 个）。再点「一键出结果」会带上这些文件。`);
    updateInitialRunHint();
    toast('已加入共用材料');
  });
  input.value='';
}

function expandChat(){const v=document.getElementById('executeView');v.classList.remove('preview-max');v.classList.add('chat-max')}
